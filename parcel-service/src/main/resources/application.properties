spring.application.name=parcel-service
server.port=8082

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/courier_parcels}
spring.datasource.username=${DB_USER:courier}
spring.datasource.password=${DB_PASSWORD:courier}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Business settings ----------
parcel.expected-delivery-days=3
