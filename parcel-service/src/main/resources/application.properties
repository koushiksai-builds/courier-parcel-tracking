spring.application.name=parcel-service
server.port=8082

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/courier_parcels?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Business settings ----------
parcel.expected-delivery-days=3