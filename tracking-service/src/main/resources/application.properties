spring.application.name=tracking-service
server.port=8083

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/courier_tracking}
spring.datasource.username=${DB_USER:courier}
spring.datasource.password=${DB_PASSWORD:courier}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
