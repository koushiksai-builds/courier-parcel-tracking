spring.application.name=tracking-service
server.port=${PORT:8083}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/courier_tracking?sslMode=${DB_SSL_MODE:DISABLED}}
spring.datasource.username=${DB_USER:courier}
spring.datasource.password=${DB_PASSWORD:courier}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
