server:
  port: ${PORT:8081}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/courier_users?sslMode=${DB_SSL_MODE:DISABLED}}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
