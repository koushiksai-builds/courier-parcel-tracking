spring.application.name=user-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/courier_users}
spring.datasource.username=${DB_USER:courier}
spring.datasource.password=${DB_PASSWORD:courier}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=courier-parcel-tracking-secret-key-change-me-0123456789
jwt.expiration-ms=86400000
