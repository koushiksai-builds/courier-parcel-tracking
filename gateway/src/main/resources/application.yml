server.port: ${PORT:8080}
spring:
  application.name: api-gateway
  cloud.gateway.routes:
    - id: user-auth
      uri: http://user-service:8081
      predicates: [Path=/api/auth/**]
    - id: user-admin
      uri: http://user-service:8081
      predicates: ["Path=/api/admin/users,/api/admin/users/**,/api/admin/couriers,/api/admin/couriers/**"]
    - id: parcel-history
      order: -2
      uri: http://tracking-service:8083
      predicates: [Path=/api/parcels/*/history]
    - id: parcels
      uri: http://parcel-service:8082
      predicates: [Path=/api/parcels/**]
    - id: parcel-admin-list
      uri: http://parcel-service:8082
      predicates: [Path=/api/admin/parcels]
      filters: [SetPath=/api/parcels/admin/all]
    - id: tracking
      uri: http://tracking-service:8083
      predicates: ["Path=/api/tracking/**,/api/admin/activities,/api/admin/activities/**"]
    - id: delivery
      uri: http://delivery-service:8084
      predicates: ["Path=/api/delivery/**,/api/admin/deliveries,/api/admin/delayed,/api/admin/delayed/**,/api/admin/exceptions,/api/admin/exceptions/**"]
    - id: notifications
      uri: http://notification-service:8085
      predicates: ["Path=/api/notifications/**,/api/admin/events/failed,/api/admin/events/failed/**"]
    - id: payments
      uri: http://payment-service:8086
      predicates: ["Path=/api/payments/**"]
