
server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - RemoveResponseHeader=WWW-Authenticate
      routes:
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/auth/**

      
        - id: user-admin
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - - Path=/api/auth/**

        - id: parcel-history
          order: -2
          uri: ${TRACKING_SERVICE_URL:http://tracking-service:8083}
          predicates:
            - Path=/api/parcels/*/history

        - id: parcels
          uri: ${PARCEL_SERVICE_URL:http://parcel-service:8082}
          predicates:
            - Path=/api/parcels/**

        - id: parcel-admin-list
          uri: ${PARCEL_SERVICE_URL:http://parcel-service:8082}
          predicates:
            - Path=/api/admin/parcels
          filters:
            - SetPath=/api/parcels/admin/all

        - id: tracking
          uri: ${TRACKING_SERVICE_URL:http://tracking-service:8083}
          predicates:
            - Path=/api/tracking/**,/api/admin/activities,/api/admin/activities/**

        - id: delivery
          uri: ${DELIVERY_SERVICE_URL:http://delivery-service:8084}
          predicates:
            - Path=/api/delivery/**,/api/admin/deliveries,/api/admin/delayed,/api/admin/delayed/**,/api/admin/exceptions,/api/admin/exceptions/**

        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/api/notifications/**,/api/admin/events/failed,/api/admin/events/failed/**,/api/admin/email-deliveries,/api/admin/email-deliveries/**,/api/support/**

        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8086}
          predicates:
            - Path=/api/payments/**
