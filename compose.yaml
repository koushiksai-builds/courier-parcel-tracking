
FROM maven:3.9.9-eclipse-temurin-21 AS build

WORKDIR /workspace

ARG APP_MODULE=user-service

COPY . .

RUN test -f "${APP_MODULE}/pom.xml" \
    || (echo "Module not found: ${APP_MODULE}" && exit 1)

RUN mvn -B -Dstyle.color=never -DskipTests \
    -pl "${APP_MODULE}" -am package

RUN JAR_PATH="$(find "/workspace/${APP_MODULE}/target" \
    -maxdepth 1 -type f -name "*.jar" \
    ! -name "original-*.jar" -print -quit)" \
    && test -n "$JAR_PATH" \
    && mkdir -p /workspace/runtime \
    && cp "$JAR_PATH" /workspace/runtime/app.jar

FROM eclipse-temurin:21-jre

WORKDIR /app

COPY --from=build /workspace/runtime/app.jar app.jar

EXPOSE 8080

ENTRYPOINT ["java", "-jar", "app.jar"]
