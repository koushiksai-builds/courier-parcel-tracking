server:
  port: ${PORT:8086}
spring:
  application.name: payment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/courier_payments?sslMode=${DB_SSL_MODE:DISABLED}}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    host: ${RABBIT_HOST:localhost}
payments:
  demo-amount: ${PAYMENT_DEMO_AMOUNT:100.00}
