server.port: ${PORT:8085}
spring:
  application.name: notification-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/courier_users}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier}
  jpa.hibernate.ddl-auto: update
  jpa.open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    listener.simple.default-requeue-rejected: false
    listener.simple.retry.enabled: true
    listener.simple.retry.max-attempts: 5
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
notifications:
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@courier.local}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8081}
