<!DOCTYPE html>

<head>

<link rel="stylesheet" href="/styles.css" />

</head>
<body>
<div class="shell">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="Courier Parcel Tracking - home">
        <span class="brand__mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
        <span class="brand__text">
          <span class="brand__name">Courier Parcel Tracking</span>
          <span class="brand__tag">Shipment operations</span>
        </span>
      </a>
      <div class="header-actions">
        <a class="btn btn--primary btn--sm" href="/">Back to app</a>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div class="page page--narrow">
      <div class="page-head"><p class="page-head__eyebrow">404</p><h1>Page not found</h1>
      <p class="page-head__sub">That address does not match any page in this application.</p></div>
      <div class="card"><div class="card__body">
        <p>The link may be out of date. Go back to the tracking page.</p>
        <div class="row" style="margin-top:20px">
          <a class="btn btn--primary" href="/">Track a shipment</a>
          <button class="btn btn--secondary" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Go back</button>
        </div>
      </div></div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer__legal">
      <span>&copy; <span id="year"></span> Courier Parcel Tracking &middot; VIT-AP University</span>
    </div>
  </footer>
</div>
<script>document.getElementById("year").textContent = String(new Date().getFullYear());</script>
</body>
</html>
