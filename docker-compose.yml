# Local development only. Production is a single container on Render (see render.yaml).
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: defaultdb
      MYSQL_USER: courier
      MYSQL_PASSWORD: courier
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: defaultdb
      DB_USER: courier
      DB_PASSWORD: courier
      DB_SSL_MODE: DISABLED
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USERNAME: guest
      RABBIT_PASSWORD: guest
      RABBIT_VHOST: /
      RABBIT_SSL_ENABLED: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # Email is opt-in. Without these the app still runs; notification
      # emails are skipped and the support form returns 503.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_RETRY_INTERVAL_MS: ${MAIL_RETRY_INTERVAL_MS:-60000}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-8}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
